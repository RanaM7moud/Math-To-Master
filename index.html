<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
<script id="m2m-form-connector">
/* =====================================================================
   Math to Master: form delivery (Web3Forms → mathtomaster@gmail.com)
   ---------------------------------------------------------------------
   Sends BOTH forms by email:
     • Contact us       → "Math to Master contact: …"
     • Suggest a video  → "New video suggestion: …"
   SETUP: create a free access key at https://web3forms.com using
   mathtomaster@gmail.com, then paste it between the quotes below.
   The key is designed to be public; it is safe in this file.
   ===================================================================== */
(function () {
  'use strict';
  var ACCESS_KEY = ''; // ← paste your Web3Forms access key here

  var API = 'https://api.web3forms.com/submit';
  var OUTBOX = 'm2m_outbox';
  var ready = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(ACCESS_KEY);
  if (!ready) { if (window.console) console.warn('[forms] Web3Forms key not set: messages stay on the visitor\'s device.'); return; }

  var nativeFetch = window.fetch.bind(window);
  var store = window.localStorage;
  var nativeSet = Storage.prototype.setItem;

  function post(fields) {
    var body = { access_key: ACCESS_KEY, from_name: 'Math to Master website' };
    for (var k in fields) if (fields[k] != null && fields[k] !== '') body[k] = fields[k];
    return nativeFetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok || !d.success) throw new Error(d.message || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  /* Outbox: anything that fails to send is kept and retried on the next visit. */
  function readOutbox() { try { return JSON.parse(store.getItem(OUTBOX) || '[]'); } catch (e) { return []; } }
  function writeOutbox(a) { try { nativeSet.call(store, OUTBOX, JSON.stringify(a)); } catch (e) {} }
  function queue(fields) { var a = readOutbox(); a.push(fields); writeOutbox(a.slice(-20)); }
  function flush() {
    var a = readOutbox(); if (!a.length) return;
    writeOutbox([]);
    a.forEach(function (f) { post(f).catch(function () { queue(f); }); });
  }

  /* 1) Contact us: the page posts to "/" (a Netlify-only address).
        Deliver it through Web3Forms and give the page a normal reply. */
  window.fetch = function (input, init) {
    try {
      var url = typeof input === 'string' ? input : (input && input.url) || '';
      var path = new URL(url, location.href).pathname;
      var body = init && init.body;
      if (init && String(init.method || '').toUpperCase() === 'POST' && path === '/' &&
          typeof body === 'string' && /(^|&)form-name=contact(&|$)/.test(body)) {
        var p = new URLSearchParams(body);
        var fields = {
          subject: 'Math to Master contact: ' + (p.get('about') || 'Message') + ' (' + (p.get('name') || '') + ')',
          name: p.get('name'), email: p.get('email'), about: p.get('about'),
          message: p.get('message'), page: location.href
        };
        return post(fields).then(
          function () { return new Response('{"success":true}', { status: 200, headers: { 'Content-Type': 'application/json' } }); },
          function () { queue(fields); return new Response('{"success":false}', { status: 502 }); }
        );
      }
    } catch (e) {}
    return nativeFetch(input, init);
  };

  /* 2) Suggest a video: the page saves suggestions on the visitor's device.
        Email each NEW suggestion as it is saved. */
  Storage.prototype.setItem = function (key, value) {
    var before = null;
    if (this === store && key === 'mt_submissions') {
      try { before = JSON.parse(this.getItem(key) || '[]'); } catch (e) { before = []; }
    }
    var result = nativeSet.apply(this, arguments);
    if (before) {
      try {
        var seen = {}; before.forEach(function (s) { seen[s.id] = 1; });
        JSON.parse(value).forEach(function (s) {
          if (seen[s.id] || s.status !== 'pending') return;
          var fields = {
            subject: 'New video suggestion: ' + (s.title || s.url),
            name: s.name, role: s.role, video_link: s.canonical || s.url, title: s.title,
            platform: s.platformLabel || s.platform, topic: s.topic, subtopic: s.subtopic,
            video_type: s.kind,
            math_check: s.flagged ? 'Needs a closer look: no math words found in the title' : 'Passed',
            page: location.href
          };
          post(fields).catch(function () { queue(fields); });
        });
      } catch (e) {}
    }
    return result;
  };

  if (document.readyState === 'complete') setTimeout(flush, 1500);
  else addEventListener('load', function () { setTimeout(flush, 1500); });
})();
</script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"2df2a2ad-917d-4224-a14e-795abf78d4eb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* =========================================================\n   MATH TO MASTER, shared stylesheet\n   Warm paper / textbook aesthetic\n   ========================================================= */\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n:root {\n  --ink:        #1a1814;\n  --ink-2:      #3d3a34;\n  --ink-3:      #6b6760;\n  --ink-4:      #9b978e;\n  --paper:      #faf8f3;\n  --paper-2:    #f2efe8;\n  --paper-3:    #e8e4d8;\n  --gold:       #c8972a;\n  --gold-light: #f5ecd4;\n  --gold-mid:   #e8c96a;\n  --teal:       #1a7a6e;\n  --teal-light: #d4f0ec;\n  --crimson:    #9b2335;\n  --crimson-light:#fae8eb;\n  --border:     1px solid #ddd9ce;\n  --radius:     6px;\n  --shadow:     0 2px 12px rgba(0,0,0,0.07);\n  --shadow-lg:  0 12px 32px rgba(26,24,20,0.18);\n}\n\nhtml, body { height: 100%; }\nbody {\n  font-family: 'DM Sans', system-ui, sans-serif;\n  background: var(--paper);\n  color: var(--ink);\n  font-size: 16px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n}\na { color: inherit; }\n\n/* =========================================================\n   TOP NAV\n   ========================================================= */\n.nav {\n  position: sticky;\n  top: 0;\n  z-index: 100;\n  background: var(--ink);\n  color: #fff;\n  border-bottom: 3px solid var(--gold);\n}\n.nav-inner {\n  max-width: 1680px;\n  margin: 0 auto;\n  display: flex;\n  align-items: center;\n  gap: 0;\n  height: 84px;\n  padding: 0 20px;\n}\n.nav-brand {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  text-decoration: none;\n  color: var(--gold-mid);\n  font-family: 'DM Serif Display', serif;\n  font-size: 20px;\n  letter-spacing: 0.01em;\n  white-space: nowrap;\n  padding-right: 24px;\n  margin-right: 16px;\n  border-right: 1px solid rgba(255,255,255,0.1);\n  height: 100%;\n}\n.nav-brand-mark {\n  height: 64px;\n  width: auto;\n  display: block;\n  flex: none;\n  background: transparent;\n}\n\n/* primary links */\n.nav-links {\n  display: flex;\n  list-style: none;\n  height: 100%;\n  flex: 1;\n  min-width: 0;\n}\n.nav-links > li {\n  position: relative;\n  height: 100%;\n  display: flex;\n  align-items: stretch;\n}\n.nav-link {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  padding: 0 11px;\n  color: rgba(255,255,255,0.78);\n  text-decoration: none;\n  font-size: 15px;\n  font-weight: 500;\n  letter-spacing: 0.03em;\n  text-transform: uppercase;\n  background: none;\n  border: 0;\n  cursor: pointer;\n  font-family: inherit;\n  white-space: nowrap;\n  transition: background .15s, color .15s;\n}\n.nav-link:hover,\n.nav-link[aria-expanded=\"true\"],\n.nav-link.active {\n  color: #fff;\n  background: rgba(255,255,255,0.06);\n}\n.nav-link.active { box-shadow: inset 0 -3px 0 var(--gold-mid); }\n.nav-link .chev {\n  width: 8px; height: 8px;\n  border-right: 1.5px solid currentColor;\n  border-bottom: 1.5px solid currentColor;\n  transform: rotate(45deg) translate(-2px, -1px);\n  transition: transform .2s;\n}\n.nav-link[aria-expanded=\"true\"] .chev {\n  transform: rotate(-135deg) translate(-2px, -1px);\n}\n\n/* dropdown panel */\n.dropdown {\n  position: absolute;\n  top: 100%;\n  left: 0;\n  min-width: 280px;\n  background: var(--paper);\n  color: var(--ink);\n  border: var(--border);\n  border-top: 3px solid var(--gold);\n  border-radius: 0 0 8px 8px;\n  box-shadow: var(--shadow-lg);\n  padding: 12px;\n  display: none;\n  z-index: 200;\n}\n.dropdown[data-open=\"true\"] { display: block; }\n.dropdown h4 {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n  color: var(--ink-4);\n  padding: 6px 10px 10px;\n  border-bottom: 1px solid var(--paper-3);\n  margin-bottom: 6px;\n}\n.dropdown a {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 10px;\n  text-decoration: none;\n  color: var(--ink-2);\n  font-size: 14px;\n  border-radius: 4px;\n  transition: background .12s, color .12s;\n}\n.dropdown a:hover {\n  background: var(--gold-light);\n  color: var(--ink);\n}\n.dropdown a .dot {\n  width: 6px; height: 6px;\n  background: var(--gold);\n  border-radius: 50%;\n  flex-shrink: 0;\n  opacity: .7;\n}\n.dropdown a.see-all {\n  margin-top: 4px;\n  border-top: 1px solid var(--paper-3);\n  color: var(--teal);\n  font-weight: 600;\n  font-size: 13px;\n}\n\n/* nav right side: search + login */\n.nav-right {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  margin-left: auto;\n  padding-left: 24px;\n  border-left: 1px solid rgba(255,255,255,0.1);\n}\n/* keep a clear gap so the icons never collide with the last nav link */\n.nav-links { margin-right: 24px; }\n@media (max-width: 1520px) {\n  .nav-right { border-left: 0; padding-left: 0; }\n  .nav-links { margin-right: 0; }\n}\n.icon-btn {\n  width: 40px; height: 40px;\n  display: grid;\n  place-items: center;\n  border: 0;\n  background: transparent;\n  color: rgba(255,255,255,0.78);\n  border-radius: 6px;\n  cursor: pointer;\n  transition: background .15s, color .15s;\n}\n.icon-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }\n.icon-btn svg { width: 20px; height: 20px; }\n\n/* nav saved (heart) button + inline count chip (no overlapping bubble) */\n.nav-saved {\n  position: relative;\n  text-decoration: none;\n  width: auto;\n  padding: 0 10px;\n  display: inline-flex;\n  align-items: cente en;\n}\n.hero::before {\n  content: '∑';\n  position: absolute;\n  right: -10px;\n  top: -60px;\n  font-family: 'DM Serif Display', serif;\n  font-size: 360px;\n  color: rgba(255,255,255,0.04);\n  line-height: 1;\n  pointer-events: none;\n}\n.hero::after {\n  content: 'π';\n  position: absolute;\n  left: -20px;\n  bottom: -100px;\n  font-family: 'DM Serif Display', serif;\n  font-style: italic;\n  font-size: 280px;\n  color: rgba(255,255,255,0.03);\n  line-height: 1;\n  pointer-events: none;\n}\n.hero-inner {\n  max-width: 1200px;\n  margin: 0 auto;\n  position: relative;\n  z-index: 1;\n}\n.hero-label {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--gold-mid);\n  margin-bottom: 16px;\n}\n.hero h1 {\n  font-family: 'DM Serif Display', serif;\n  font-size: clamp(36px, 5.6vw, 64px);\n  line-height: 1.04;\n  margin-bottom: 20px;\n  max-width: 760px;\n  font-weight: 400;\n}\n.hero h1 em { color: var(--gold-mid); font-style: italic; }\n.hero p {\n  font-size: 17px;\n  color: rgba(255,255,255,0.7);\n  max-width: 560px;\n  margin-bottom: 32px;\n}\n.hero-chips {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n}\n.hero-chip {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12px;\n  padding: 6px 12px;\n  background: rgba(255,255,255,0.07);\n  border: 1px solid rgba(255,255,255,0.14);\n  color: rgba(255,255,255,0.85);\n  border-radius: 20px;\n  text-decoration: none;\n  transition: background .15s, border-color .15s;\n}\n.hero-chip:hover { background: rgba(255,255,255,0.14); border-color: var(--gold-mid); }\n.hero-chip-community {\n  background: rgba(200,151,42,0.16);\n  border-color: var(--gold-mid);\n  color: var(--gold-mid);\n  font-weight: 600;\n}\n.hero-chip-community:hover { background: rgba(200,151,42,0.28); }\n.hero-chip-all {\n  background: transparent;\n  border-color: rgba(255,255,255,0.28);\n  font-weight: 600;\n}\n.hero-chip-all:hover { background: rgba(255,25   font-size: 14px;\n  font-weight: 600;\n  color: var(--ink-2);\n  cursor: pointer;\n  transition: border-color .15s, color .15s, background .15s;\n}\n.show-all-btn:hover { border-color: var(--gold); color: var(--ink); background: var(--gold-light); }\n.show-all-btn .saa-chev { font-size: 12px; color: var(--gold); }\n.subtopic { text-align: center; }\n.subtopic .subtopic-head, .subtopic .video-grid { text-align: left; }\n.vc-link {\n  text-decoration: none;\n  color: inherit;\n  display: flex;\n  flex-direction: column;\n}\n.vc-alts {\n  display: flex;\n  align-items: center;\n  flex-wrap: nowrap;\n  gap: 6px;\n  padding: 8px 2px 0;\n}\n.vc-alts.is-expanded { flex-wrap: wrap; }\n.vc-alts:not(.is-expanded) .vc-alts-label { display: none; }\n.vc-alts.is-expanded .vc-alt-more { margin-left: auto !important; order: 999; }\n/* full-width spacer forces Show less onto its own line, then margin-left:auto pins it right */\n.vc-alts.is-expanded::after { content: \"\"; flex-basis: 100%; height: 0; order: 998; }\n/* On touch screens a tapped button keeps its hover colour; keep Show less plain. */\n@media (hover: none) {\n  .vc-alt-more:hover { border-color: var(--ink-3); color: var(--ink-3); background: transparent; }\n}\n.vc-alts-label {\n  flex: none;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  color: var(--ink-4);\n}\n.vc-alt {\n  display: inline-flex;\n  align-items: center;\n  min-width: 0;\n  overflow: hidden;\n  white-space: nowrap;\n  gap: 5px;\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--ink-2);\n  text-decoration: none;\n  background: var(--paper-2);\n  border: var(--border);\n  padding: 4px 9px;\n  border-radius: 20px;\n  transition: background .12s, border-color .12s, color .12s;\n}\n.vc-alt:hover { background: var(--gold-light); border-color: var(--gold); color: var(--ink); }\n.vc-alt-more {\n  display: inline-flex;\n  align-items: center;\n  flex: none;\n  margin-left: auto;\n  white-space: nowrap;\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--ink-3);\n  background: transparent;\n  border: 1px dashed var(--ink-3);\n  padding: 4px 9px;\n  border-radius: 20px;\n  cursor: pointer;\n  transition: border-color .12s, color .12s, background .12s;\n}\n.vc-alt-more:hover { border-color: var(--gold); color: var(--ink); background: var(--gold-light); }\n.vc-alt-practice { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }\n.vc-alt-practice:hover { background: var(--teal-light); border-color: var(--teal); color: var(--ink); }\n.vc-alt-mistake { background: var(--crimson-light); border-color: var(--crimson); color: var(--crimson); }\n.vc-alt-mistake:hover { background: var(--crimson-light); border-color: var(--crimson); color: var(--ink); }\n.vc-alt-ic {\n  width: 9px; height: 9px;\n  flex-shrink: 0;\n  fill: currentColor;\n  opacity: .85;\n}\n.vc-alt-ch {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 9.5px;\n  font-weight: 500;\n  color: var(--ink-4);\n}\n/* Common Mistakes review strip (bottom of topic pages) */\n.mistakes-strip {\n  margin: 8px 0 48px;\n  padding: 24px;\n  background: linear-gradient(180deg, var(--gold-light), var(--paper));\n  border: 1px solid var(--gold-mid);\n  border-radius: 12px;\n}\n.mistakes-head {\n  display: flex;\n  align-items: flex-start;\n  gap: 14px;\n  margin-bottom: 18px;\n}\n.mistakes-icon {\n  font-size: 22px;\n  line-height: 1;\n  flex-shrink: 0;\n  filter: saturate(1.2);\n}\n.mistakes-head h3 {\n  font-family: 'DM Serif Display', serif;\n  font-size: 22px;\n  font-weight: 400;\n  color: var(--ink);\n  line-height: 1.1;\n}\n.mistakes-head p { font-size: 14px; color: var(--ink-3); margin-top: 2px; }\n.mistakes-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));\n  gap: 10px;\n}\n.mistake-card {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 11px 13px;\n  background: #fff;\n  border: var(--border);\n  border-radius: 8px;\n  text-decoration: none;\n  transition: border-color .15s, transform .12s, box-shadow .15s;\n}\n.mistake-card:hover { border-color: var(--gold); transform: translateY(-1px); box-shadow: var(--shadow); }\n.mistake-play {\n  width: 26px; height: 26px;\n  flex-shrink: 0;\n  display: grid; place-items: center;\n  background: var(--crimson);\n  color: #fff;\n  border-radius: 50%;\n  font-size: 10px;\n  padding-left: 2px;\n}\n.mistake-meta { display: flex; flex-direction: column; min-width: 0; }\n.mistake-skill { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.25; }\n.mistake-ch {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  color: var(--ink-4);\n  margin-top: 2px;\n}\n/* Practice strip — teal theme, distinct from the gold Mistakes strip */\n.practice-strip {\n  margin: 8px 0 48px;\n  padding: 24px;\n  background: linear-gradient(180deg, var(--teal-light), var(--paper));\n  border: 1px solid var(--teal);\n  border-radius: 12px;\n}\n.practice-head {\n  display: flex;\n  align-items: flex-start;\n  gap: 14px;\n  margin-bottom: 18px;\n}\n.practice-icon { font-size: 22px; line-height: 1; flex-shrink: 0; color: var(--teal); font-weight: 700; }\n.practice-head h3 {\n  font-family: 'DM Serif Display', serif;\n  font-size: 22px;\n  font-weight: 400;\n  color: var(--ink);\n  line-height: 1.1;\n}\n.practice-head p { font-size: 14px; color: var(--ink-3); margin-top: 2px; }\n.practice-card {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 11px 13px;\n  background: #fff;\n  border: var(--border);\n  border-radius: 8px;\n  text-decoration: none;\n  transition: border-color .15s, transform .12s, box-shadow .15s;\n}\n.practice-card:hover { border-color: var(--teal); transform: translateY(-1px); box-shadow: var(--shadow); }\n.practice-play {\n  width: 26px; height: 26px;\n  flex-shrink: 0;\n  display: grid; place-items: center;\n  background: var(--teal);\n  color: #fff;\n  border-radius: 50%;\n  font-size: 10px;\n  padding-left: 2px;\n}\n\n.thumb {\n  position: relative;\n  aspect-ratio: 16 / 9;\n  border-radius: 10px;\n  overflow: hidden;\n  box-shadow: var(--shadow);\n  background: var(--ink);\n  display: grid;\n  place-items: center;\n  isolation: isolate;\n}\n.thumb::after {\n  /* subtle paper texture overlay */\n  content: '';\n  position: absolute;\n  inset: 0;\n  background:\n    repeating-linear-gradient(\n      45deg,\n      rgba(255,255,255,0.025) 0 2px,\n      transparent 2px 6px);\n  pointer-events: none;\n}\n.thumb-bg {\n  position: absolute;\n  inset: 0;\n  z-index: 0;\n}\n.thumb-formula {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n  width: 100%;\n  box-sizing: border-box;\n  z-index: 1;\n  font-family: 'DM Serif Display', serif;\n  font-style: italic;\n  font-size: 44px;\n  color: rgba(255,255,255,0.95);\n  text-align: center;\n  padding: 0 16px;\n  text-shadow: 0 2px 8px rgba(0,0,0,0.4);\n}\n.thumb-formula .small { font-size: 0.6em; }\n\n.thumb .play {\n  position: absolute;\n  z-index: 2;\n  inset: 0;\n  display: grid;\n  place-items: center;\n  opacity: 0;\n  background: rgba(26,24,20,0.35);\n  transition: opacity .2s;\n}\n.video-card:hover .thumb .play { opacity: 1; }\n.thumb .play-circle {\n  width: 60px; height: 60px;\n  border-radius: 50%;\n  background: rgba(255,255,255,0.95);\n  display: grid; place-items: center;\n  box-shadow: 0 6px 20px rgba(0,0,0,0.3);\n}\n.thumb .play-circle svg { width: 26px; height: 26px; color: var(--crimson); margin-left: 4px; }\n\n/* Small always-visible \"video\" badge in the corner — signals playability\n   without covering the formula or mimicking the YouTube logo. */\n.thumb-playtag {\n  position: absolute;\n  z-index: 2;\n  left: 8px;\n  bottom: 8px;\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  background: rgba(0,0,0,0.55);\n  color: rgba(255,255,255,0.95);\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 11px;\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  padding: 4px 9px 4px 8px;\n  border-radius: 5px;\n  backdrop-filter: blur(2px);\n  transition: background .15s;\n}\n.thumb-playtag .pt-tri {\n  width: 0; height: 0;\n  border-left: 7px solid currentColor;\n  border-top: 5px solid transparent;\n  border-bottom: 5px solid transparent;\n}\n.video-card:hover .thumb-playtag { background: var(--crimson); }\n\n.thumb-duration {\n  position: absolute;\n  z-index: 2;\n  right: 8px;\n  bottom: 8px;\n  background: rgba(0,0,0,0.78);\n  color: #fff;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 11px;\n  padding: 2px 6px;\n  border-radius: 3px;\n}\n.thumb-cat {\n  position: absolute;\n  z-index: 2;\n  left: 8px;\n  top: 8px;\n  background: rgba(255,255,255,0.95);\n  color: var(--ink);\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  font-weight: 600;\n  padding: 3px 7px;\n  border-radius: 3px;\n}\n\n.video-meta { padding: 12px 2px 0; }\n.video-title {\n  font-size: 16px;\n  font-weight: 600;\n  color: var(--ink);\n  line-height: 1.35;\n  margin-bottom: 6px;\n  display: -webkit-box;\n  -webkit-line-clamp: 2;\n  -webkit-box-orient: vertical;\n  overflow: hidden;\n}\n.video-card:hover .video-title { color: var(--teal); }\n.video-sub {\n  font-size: 13px;\n  color: var(--ink-3);\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.video-sub .dot { width: 3px; height: 3px; background: var(--ink-4); border-radius: 50%; }\n.video-sub .vid-ch {\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  color: var(--teal);\n  font-weight: 600;\n}\n.video-sub .vid-ch::before {\n  content: '';\n  width: 0;\n  height: 0;\n  border-left: 5px solid currentColor;\n  border-top: 3px solid transparent;\n  border-bottom: 3px solid transparent;\n  opacity: 0.8;\n}\n\n/* ---- card action buttons (favorite heart + watched check) ---- */\n.thumb .play { pointer-events: none; }\n.card-actions {\n  position: absolute;\n  top: 8px;\n  right: 8px;\n  z-index: 3;\n  display: flex;\n  gap: 6px;\n}\n.card-action {\n  width: 30px; height: 30px;\n  border: 0;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  cursor: pointer;\n  background: rgba(26,24,20,0.5);\n  color: #fff;\n  backdrop-filter: blur(3px);\n  opacity: 0;\n  transition: opacity .15s, background .15s, color .15s, transform .1s;\n}\n.video-card:hover .card-action { opacity: 1; }\n.card-action[aria-pressed=\"true\"] { opacity: 1; }\n.card-action:hover { transform: scale(1.1); }\n.card-action:active { transform: scale(0.92); }\n.card-action svg { width: 16px; height: 16px; }\n.act-fav svg { fill: currentColor; }\n.act-fav[aria-pressed=\"true\"] { background: #fff; color: var(--crimson); }\n.act-watch[aria-pressed=\"true\"] { background: #fff; color: var(--teal); }\n@media (hover: none) { .card-action { opacity: 1; } }\n\n/* watched state on the card */\n.video-card.is-watched .thumb { outline: 3px solid var(--teal); outline-offset: -3px; }\n.watched-tag {\n  position: absolute;\n  z-index: 2;\n  left: 8px;\n  bottom: 8px;\n  display: none;\n  align-items: center;\n  background: var(--teal);\n  color: #fff;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.04em;\n  padding: 3px 7px;\n  border-radius: 3px;\n}\n.video-card.is-watched .watched-tag { display: inline-flex; }\n\n/* start-here badge reuses the category slot */\n.thumb-cat.is-start {\n  background: var(--ink);\n  color: var(--gold);\n  font-weight: 700;\n  box-shadow: 0 1px 4px rgba(0,0,0,0.3);\n}\n\n/* per-subtopic progress pill */\n.subtopic-head .sub-progress {\n  margin-left: auto;\n  align-self: center;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12px;\n  color: var(--ink-3);\n  background: var(--paper-2);\n  border: var(--border);\n  padding: 5px 12px;\n  border-radius: 20px;\n  white-space: nowrap;\n}\n.subtopic-head .sub-progress b { color: var(--teal); }\n.subtopic.is-complete .sub-progress {\n  background: var(--teal-light);\n  color: var(--teal);\n  border-color: var(--teal);\n}\n\n/* per-topic progress bar (in topic header) */\n.topic-progress {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  margin-top: 22px;\n  max-width: 540px;\n}\n.topic-progress-track {\n  flex: 1;\n  height: 8px;\n  background: var(--paper-3);\n  border-radius: 99px;\n  overflow: hidden;\n}\n.topic-progress-track span {\n  display: block;\n  height: 100%;\n  width: 0;\n  background: var(--teal);\n  border-radius: 99px;\n  transition: width .45s ease;\n}\n.topic-progress-label {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12px;\n  color: var(--ink-3);\n  white-space: nowrap;\n}\n\n/* ---- \"How to use\" band + homepage progress strip ---- */\n.howto {\n  background: var(--paper-2);\n  border-top: var(--border);\n  border-bottom: var(--border);\n}\n.howto-inner {\n  max-width: 1200px;\n  margin: 0 auto;\n  padding: 36px 24px 28px;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 28px 40px;\n  align-items: flex-start;\n}\n.howto-lead { flex-shrink: 0; }\n.howto-kicker {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 11.6px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: #A8801F;\n  font-weight: 600;\n  margin-bottom: 6px;\n}\n.howto-lead h2 {\n  font-family: 'DM Serif Display', serif;\n  font-size: 26px;\n  font-weight: 400;\n  color: var(--ink);\n  line-height: 1.1;\n}\n.howto-steps {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 24px;\n  flex: 1;\n  min-width: 280px;\n}\n.howto-step {\n  display: flex;\n  gap: 12px;\n  align-items: flex-start;\n  flex: 1;\n  min-width: 200px;\n}\n.howto-step .n {\n  flex-shrink: 0;\n  width: 30px; height: 30px;\n  border-radius: 50%;\n  background: var(--ink);\n  color: var(--gold-mid);\n  display: grid;\n  place-items: center;\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 13px;\n  font-weight: 600;\n}\n.howto-step b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 3px; }\n.howto-step p { font-size: 15px; color: var(--ink-3); line-height: 1.55; }\n.howto-step p a { color: var(--teal); font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(79,209,197,.4); }\n.howto-step p a:hover { border-bottom-color: var(--teal); }\n.howto-step .ic-heart { color: var(--crimson); }\n.howto-step .ic-check { color: var(--teal); }\n\n.home-progress {\n  max-width: 1200px;\n  margin: 0 auto;\n  padding: 0 24px 32px;\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  flex-wrap: wrap;\n}\n.home-progress-track {\n  flex: 1;\n  min-width: 200px;\n  height: 10px;\n  background: var(--paper-3);\n  border-radius: 99px;\n  overflow: hidden;\n}\n.home-progress-track span {\n  display: block;\n  height: 100%;\n  width: 0;\n  background: var(--teal);\n  border-radius: 99px;\n  transition: width .5s ease;\n}\n.home-progress-label {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12.5px;\n  color: var(--ink-3);\n  white-space: nowrap;\n}\n.home-progress-label b { color: var(--ink); }\n\n/* dedicated Saved page empty state */\n.saved-empty {\n  text-align: center;\n  padding: 36px 24px 56px;\n  max-width: 460px;\n  margin: 0 auto;\n}\n.saved-empty-heart {\n  font-size: 56px;\n  color: var(--paper-3);\n  line-height: 1;\n  margin-bottom: 12px;\n}\n.saved-empty h3 {\n  font-family: 'DM Serif Display', serif;\n  font-size: 26px;\n  font-weight: 400;\n  color: var(--ink);\n  margin-bottom: 8px;\n}\n.saved-empty p {\n  font-size: 15px;\n  color: var(--ink-3);\n  margin-bottom: 24px;\n}\n.saved-empty-btn {\n  display: inline-block;\n  background: var(--ink);\n  color: var(--gold-mid);\n  text-decoration: none;\n  font-size: 14px;\n  font-weight: 600;\n  padding: 12px 24px;\n  border-radius: 6px;\n}\n.saved-empty-btn:hover { background: #2a2620; }\n\n/* =========================================================\n gba(246,231,190,.6)}\n.watch-back{margin:14px 4px 0;font:inherit;font-weight:700;font-size:15px;color:#1A1814;background:#E8C96A;border:0;border-radius:999px;padding:9px 20px;cursor:pointer}\n.watch-x{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;border:0;background:#E8C96A;color:#1A1814;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35)}\nbody.watch-lock{overflow:hidden}\n@media (max-width:700px){.watch-x{top:6px;right:6px}.watch-box{padding:10px}}\n@media (prefers-reduced-motion: reduce){.watch-ov{animation:none}}\n.watch-btns{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 4px 0}\n.watch-btns .watch-back{margin:0}\n.watch-yt{font-weight:700;font-size:15px;color:#F6E7BE;text-decoration:none;border:1.5px solid rgba(246,231,190,.45);border-radius:999px;padding:8px 18px}\n.watch-yt:hover{border-color:#E8C96A;color:#E8C96A}\n.fun-result-ov{position:fixed;inset:0;z-index:150;background:rgba(26,24,20,.55);display:grid;place-items:center;padding:20px;animation:watchIn .2s ease-out}\n.fun-result-box{width:min(560px,100%);background:var(--paper);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:funPop .4s cubic-bezier(.2,1.4,.4,1)}\n.fun-result-box .fun-badge{margin:0}\n.fun-result-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}\n.fun-result-btns button{font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:9px 20px;cursor:pointer;border:0}\n.fun-result-see{background:var(--ink);color:#F6E7BE}\n.fun-result-new{background:#E8C96A;color:#1A1814}\n@media (prefers-reduced-motion: reduce){.fun-result-ov,.fun-result-box{animation:none}}\n.pc-field[hidden]{display:none}\n.foot-dd > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}\n.foot-dd > summary::-webkit-details-marker{display:none}\n.foot-dd > summary h5{margin:0}\n.foot-dd-chev{width:7px;height:7px;border-right:2px solid var(--gold);b n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <section class=\"howto\">\n      <div class=\"howto-inner\">\n        <div class=\"howto-lead\">\n          <div class=\"howto-kicker\">New here?<\u002Fdiv>\n          <h2>How to use this site<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"howto-steps\">\n          <div class=\"howto-step\"><span class=\"n\">1<\u002Fspan><div><b>Pick a topic<\u002Fb><p>Browse by trick, or follow a full course from pre-algebra to calculus.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"howto-step\"><span class=\"n\">2<\u002Fspan><div><b>Watch one lesson<\u002Fb><p>Every card opens a single, hand-picked video with its length shown.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"howto-step\"><span class=\"n\">3<\u002Fspan><div><b>Save &amp; track<\u002Fb><p>Tap the <span class=\"ic-heart\">heart<\u002Fspan> to save a favorite and the <span class=\"ic-check\">check<\u002Fspan> to mark a lesson done.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"howto-step\"><span class=\"n\">4<\u002Fspan><div><b>Check yourself<\u002Fb><p>Take a quick <a href=\"practice.html\">quiz<\u002Fa> on one topic, or a mixed set drawn from every topic.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"howto-suggest\">Know a great math video? <a href=\"#\" id=\"howtoSuggest\">Suggest it →<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"home-progress\">\n        <div class=\"home-progress-track\"><span id=\"homeBar\"><\u002Fspan><\u002Fdiv>\n        <div class=\"home-progress-label\"><b id=\"homeWatched\">0<\u002Fb> of <span id=\"homeTotal\">291<\u002Fspan> lessons <span style=\"color:var(--teal); font-weight:600;\">✓ watched<\u002Fspan> · <a href=\"saved.html\" style=\"color:var(--crimson); text-decoration:none; font-weight:600;\"><b id=\"homeFav\">0<\u002Fb> ♥ saved<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <main class=\"page\">\n      <section class=\"section\">\n        <div class=\"section-head\">\n          <div class=\"section-head-l\">\n            <span class=\"section-num\">Featured · start here<\u002Fspan>\n            <h2>Quick wins<\u002Fh2>\n          <\u002Fdiv>\n          <a class=\"section-link\" href=\"#browse\">Browse all topics ↓<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"video-grid\" id=\"featuredRoot\"><\u002Fdiv>\n      <\u002Fsection>\n\n      <div id=\"browse\"><\u002Fdiv>\n      <div id=\"browseRoot\"><\u002Fdiv>\n    <\u002Fmain>\n  `;\n\n  const TERMS_HTML = `\n    <main class=\"legal\" style=\"max-width:820px;margin:0 auto;padding:56px 24px 80px;\">\n      <h1 style=\"font-family:'DM Serif Display',serif;font-size:clamp(34px,5vw,52px);font-weight:400;line-height:1.05;margin-bottom:10px;\">Terms of Use<\u002Fh1>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-4);margin-bottom:32px;\">Last updated: June 2026<\u002Fdiv>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">Welcome to Math to Master. By using this website, you agree to these terms.<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin:36px 0 12px;\">1. What Math to Master is<\u002Fh2>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">Math to Master is a free, curated study guide that organizes and links to math videos hosted on third-party platforms. We do not host, store, or stream any video files ourselves; every video plays on its original platform and belongs to its respective creator.<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin:36px 0 12px;\">2. Content ownership &amp; credit<\u002Fh2>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">Linked videos remain the property of their creators and platforms; all rights and credit belong to them. Our original materials, the Math to Master name, logo, site design, written text, curation, and our own original videos and animations, are the property of Math to Master and protected by copyright. You may not copy, reproduce, or republish our original design, branding, or content without permission.<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin:36px 0 12px;\">3. Creator opt-out<\u002Fh2>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">If you are a creator and prefer your video not be listed, contact us. Once we can reasonably verify you are the owner, we will remove the link promptly.<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin:36px 0 12px;\">4. Community submissions<\u002Fh2>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">Suggested videos must be math-educational and are reviewed by us before they appear; submission does not guarantee listing. By submitting a link you confirm that the video is appropriate, lawful, and math-educational, that you have the right to share it, and that it does not infringe anyone's rights. You are solely responsible for what you submit, and Math to Master accepts no responsibility for third-party content you or others submit. We may decline, edit, or remove any submission at any time, at our sole discretion, and may block submitters who abuse this feature.<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin:36px 0 12px;\">5. Disclaimer &amp; limitation of liability<\u002Fh2>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">Math to Master only links to videos hosted elsewhere; we do not control, endorse, or guarantee third-party content. To the fullest extent permitted by law, we are not liable for any loss or damage arising from your use of the site or from any linked or submitted content. You use the site and any linked videos at your own risk.<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin:36px 0 12px;\">6. Acceptable use<\u002Fh2>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">Use the site for personal, educational purposes. Do not copy, scrape, clone, or republish the site or its design, and do not misuse the submission feature.<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin:36px 0 12px;\">7. No warranty<\u002Fh2>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">The site and its links are provided \"as is.\" Third-party videos may be changed or removed by their owners at any time, which is outside our control.<\u002Fp>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;margin:36px 0 12px;\">8. Contact<\u002Fh2>\n      <p style=\"color:var(--ink-2);margin-bottom:14px;line-height:1.7;\">Questions, takedown requests, or feedback: <a href=\"#\" class=\"mail-link\" data-mail-user=\"mathtomaster\" data-mail-host=\"gmail.com\" style=\"color:var(--teal);\">Contact us<\u002Fa><\u002Fp>\n    <\u002Fmain>\n  `;\n\n  function currentRoute() {\n    const hash = location.hash.slice(1);\n    if (!hash || hash === '/') return { key: 'index', anchor: '' };\n    const parts = hash.split('#');\n    const key = parts[0].replace(/^\\//, '') || 'index';\n    const anchor = parts.slice(1).join('#');\n    return { key, anchor };\n  }\n\n  const ROUTES = ['index','saved','community','practice','quizzes','terms'];\n  let lastKey = null;\n\n  function isRoute(k) {\n    return ROUTES.includes(k) || (window.SITE && window.SITE.pages.some(p => p.key === k));\n  }\n\n  function render() {\n    const { key, anchor } = currentRoute();\n    const root = document.getElementById('appRoot');\n    if (!root || !window.SITE) return;\n\n    // A plain section link like #distance-rate-time is not a page.\n    // If that section is on screen, scroll to it and keep the current page.\n    if (!isRoute(key) && lastKey) {\n      const el = document.getElementById(key);\n      if (el) {\n        history.replaceState(null, '', '#' + lastKey + '#' + key);\n        const top = el.getBoundingClientRect().top + window.scrollY - 80;\n        window.scrollTo({ top, behavior: 'smooth' });\n        return;\n      }\n    }\n    if (isRoute(key)) lastKey = key;\n\n    if (key === 'index') {\n      root.innerHTML = HOME_HTML;\n      window.renderHome();\n      document.title = 'Math to Master, clear math videos, one skill at a time';\n    } else if (key === 'saved') {\n      root.innerHTML = '<div id=\"topicRoot\"><\u002Fdiv>';\n      window.renderSavedPage();\n      document.title = 'Saved videos | Math to Master';\n    } else if (key === 'community') {\n      root.innerHTML = '<div id=\"topicRoot\"><\u002Fdiv>';\n      window.renderCommunityPage();\n      document.title = 'Community picks | Math to Master';\n    } else if (key === 'practice' || key === 'quizzes') {\n      root.innerHTML = '<div id=\"topicRoot\"><\u002Fdiv>';\n      window.renderPracticePage();\n      document.title = 'Quizzes | Math to Master';\n    } else if (key === 'terms') {\n      root.innerHTML = TERMS_HTML;\n      document.title = 'Terms of Use | Math to Master';\n      window.scrollTo(0, 0);\n    } else {\n      const pg = window.SITE.pages.find(p => p.key === key);\n      if (!pg) {\n        // unknown route → home\n        root.innerHTML = HOME_HTML;\n        window.renderHome();\n        return;\n      }\n      root.innerHTML = '<div id=\"topicRoot\"><\u002Fdiv>';\n      window.renderTopicPage(key);\n      document.title = pg.label + ' | Math to Master';\n    }\n\n    // Sync nav active state\n    document.querySelectorAll('.nav-link[data-dd]').forEach(b => {\n      b.classList.toggle('active', b.dataset.dd === key);\n    });\n\n    // Close mobile menu on nav\n    const navLinks = document.querySelector('.nav-links');\n    if (navLinks) navLinks.removeAttribute('data-open');\n\n    // Scroll to anchor or top\n    if (anchor) {\n      // Delay so newly-injected content is laid out\n      setTimeout(() => {\n        const el = document.getElementById(anchor);\n        if (el) {\n          const top = el.getBoundingClientRect().top + window.scrollY - 80;\n          window.scrollTo({ top, behavior: 'auto' });\n        } else {\n          window.scrollTo(0, 0);\n        }\n      }, 30);\n    } else {\n      window.scrollTo(0, 0);\n    }\n  }\n\n  // Intercept clicks on links that point to one of our pretend .html pages\n  document.addEventListener('click', (e) => {\n    const a = e.target.closest('a');\n    if (!a) return;\n    if (a.target === '_blank') return;\n    const href = a.getAttribute('href');\n    if (!href) return;\n    // Match foo.html or foo.html#bar (no slashes, only top-level pages)\n    const m = href.match(/^([\\w-]+)\\.html(?:#(.+))?$/);\n    if (!m) return;\n    e.preventDefault();\n    const key = m[1];\n    const anchor = m[2] || '';\n    const newHash = '#/' + (key === 'index' ? '' : key) + (anchor ? '#' + anchor : '');\n    if (location.hash === newHash) {\n      render();\n    } else {\n      window.__navByCode = true;\n    location.hash = newHash;\n    }\n  });\n\n  // Remember where each page was scrolled to, so Back returns to the same spot\n  // (for example the footer) instead of the top.\n  const scrollMem = {};\n  let lastHash = location.hash;\n  // A tap on a link (or any code that sets location.hash) is a NEW visit and\n  // must start at the top. A hashchange with no such tap is Back or Forward.\n  let navByClick = false;\n  document.addEventListener('click', (e) => { if (e.target.closest('a[href]')) navByClick = true; }, true);\n  window.addEventListener('hashchange', () => {\n    scrollMem[lastHash] = window.scrollY;\n    const back = !navByClick && !window.__navByCode; navByClick = false; window.__navByCode = false;\n    lastHash = location.hash;\n    render();\n    if (back && scrollMem[location.hash] != null) {\n      const y = scrollMem[location.hash];\n      requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y)));\n    }\n  });\n\n  // Wait for shared.js to finish injecting the nav + footer\n  function waitAndRender() {\n    if (window.SITE && window.renderHome && window.renderTopicPage\n        && document.querySelector('.nav-link[data-dd]')) {\n      render();\n    } else {\n      setTimeout(waitAndRender, 25);\n    }\n  }\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', waitAndRender);\n  } else {\n    waitAndRender();\n  }\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
